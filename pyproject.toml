[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memrail"
version = "0.1.0"
description = "Context budget manager for long-running AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Memrail" }]
keywords = ["llm", "agents", "context", "anthropic", "claude", "compression"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
memrail = "memrail.cli.main:app"

[project.urls]
Homepage = "https://github.com/memrail/memrail"
Issues = "https://github.com/memrail/memrail/issues"

[tool.hatch.build.targets.wheel]
packages = ["memrail"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
