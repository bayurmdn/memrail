<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="rail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="120" rx="12" fill="url(#bg)"/>

  <!-- Rail tracks -->
  <line x1="20" y1="96" x2="460" y2="96" stroke="url(#rail)" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="106" x2="460" y2="106" stroke="url(#rail)" stroke-width="3" stroke-linecap="round"/>
  <!-- Sleepers -->
  <line x1="40"  y1="92" x2="40"  y2="110" stroke="#4f46e5" stroke-width="2" opacity="0.6"/>
  <line x1="80"  y1="92" x2="80"  y2="110" stroke="#4f46e5" stroke-width="2" opacity="0.6"/>
  <line x1="120" y1="92" x2="120" y2="110" stroke="#4f46e5" stroke-width="2" opacity="0.6"/>
  <line x1="160" y1="92" x2="160" y2="110" stroke="#4f46e5" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="92" x2="200" y2="110" stroke="#4f46e5" stroke-width="2" opacity="0.6"/>
  <line x1="240" y1="92" x2="240" y2="110" stroke="#4f46e5" stroke-width="2" opacity="0.6"/>
  <line x1="280" y1="92" x2="280" y2="110" stroke="#4f46e5" stroke-width="2" opacity="0.6"/>
  <line x1="320" y1="92" x2="320" y2="110" stroke="#4f46e5" stroke-width="2" opacity="0.6"/>
  <line x1="360" y1="92" x2="360" y2="110" stroke="#4f46e5" stroke-width="2" opacity="0.6"/>
  <line x1="400" y1="92" x2="400" y2="110" stroke="#4f46e5" stroke-width="2" opacity="0.6"/>
  <line x1="440" y1="92" x2="440" y2="110" stroke="#4f46e5" stroke-width="2" opacity="0.6"/>

  <!-- mem text -->
  <text x="24" y="72" font-family="'SF Mono', 'Fira Code', monospace" font-size="48" font-weight="700" fill="#e2e8f0" letter-spacing="-1">mem</text>
  <!-- rail text in purple -->
  <text x="148" y="72" font-family="'SF Mono', 'Fira Code', monospace" font-size="48" font-weight="700" fill="url(#rail)" letter-spacing="-1">rail</text>

  <!-- Tagline -->
  <text x="312" y="68" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#64748b">context budget manager</text>
  <text x="312" y="84" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#64748b">for long-running agents</text>
</svg>
